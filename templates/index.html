<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Push30 — Партнёры</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/styles.css" />
  <script type="application/json" id="partners-boot">{{ partners_json | safe }}</script>
</head>
<body>
  <div id="app" class="min-h-screen bg-[var(--p-bg)] text-[var(--p-txt-1)] transition-colors duration-200">
    <header class="sticky top-0 z-40 border-b border-[var(--p-hd-bd)] bg-[var(--p-hd-bg)]/95 shadow-[0_18px_42px_rgba(0,0,0,0.12)] backdrop-blur">
      <div class="mx-auto flex max-w-7xl flex-col gap-4 px-4 py-4 sm:px-6">
        <div class="flex flex-col gap-3 lg:flex-row lg:items-center">
          <div class="flex flex-1 items-center gap-3">
            <div class="flex h-10 w-10 flex-shrink-0 items-center justify-center rounded-lg border border-[var(--p-logo-bd)] bg-[var(--p-logo-bg)] text-[var(--p-logo-ic)] shadow-inner" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.4 14.4 9.6 9.6"/><path d="M18.657 21.485a2 2 0 1 1-2.931-2.931 2 2 0 0 1 2.931 2.931z"/><path d="M6.343 6.343a2 2 0 1 1 2.931 2.931 2 2 0 0 1-2.931-2.931z"/><path d="M21.485 6.343a2 2 0 1 1-2.931 2.931 2 2 0 0 1 2.931-2.931z"/><path d="M6.343 21.485a2 2 0 1 1 2.931-2.931 2 2 0 0 1-2.931 2.931z"/></svg>
            </div>
            <div>
              <h1 class="text-xl font-black leading-tight tracking-wide text-[var(--p-logo-t1)]">Push30</h1>
              <p class="text-xs font-semibold uppercase tracking-[0.18em] text-[var(--p-logo-t2)]">Каталог партнёров</p>
            </div>
          </div>
          <div class="flex items-center gap-2">
            <div class="relative flex-1 lg:w-80">
              <svg class="absolute left-3 top-1/2 h-[15px] w-[15px] -translate-y-1/2 text-[var(--p-txt-3)]" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
              <input id="search" type="text" placeholder="Поиск партнёра или услуги..."
                class="w-full rounded-lg border border-[var(--p-in-bd)] bg-[var(--p-in-bg)] py-2.5 pl-9 pr-4 text-sm font-medium text-[var(--p-in-tx)] placeholder:text-[var(--p-in-pl)] transition focus:border-[var(--p-in-fc)] focus:outline-none focus:ring-2 focus:ring-[var(--p-in-fc)]/30" />
            </div>
            <button id="themeBtn" type="button" title="Тема"
              class="flex h-10 w-10 flex-shrink-0 items-center justify-center rounded-lg border border-[var(--p-btn-bd)] bg-[var(--p-in-bg)] text-[var(--p-txt-2)] transition hover:bg-[var(--p-btn-hv)] hover:text-[var(--p-txt-1)]"
              aria-label="Переключить тему"></button>
          </div>
        </div>
        <div class="flex flex-col gap-3">
          <div class="flex flex-wrap items-center gap-2">
            <button type="button" data-tab="main" id="tabMain"
              class="rounded-lg px-4 py-2 text-sm font-bold transition">Залы ({{ main_count }})</button>
            <button type="button" data-tab="discount" id="tabDiscount"
              class="rounded-lg px-4 py-2 text-sm font-bold transition inline-flex items-center gap-1.5">
              <svg class="h-[13px] w-[13px]" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2H2v10l9.29 9.29c.94.94 2.48.94 3.42 0l6.58-6.58c.94-.94.94-2.48 0-3.42L12 2Z"/><path d="M7 7h.01"/></svg>
              Дискаунт ({{ discount_count }})
            </button>
            <div class="ml-0 flex items-center gap-2 text-xs font-bold uppercase tracking-[0.16em] text-[var(--p-txt-2)] sm:ml-2">
              <svg class="h-[14px] w-[14px]" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" x2="4" y1="21" y2="14"/><line x1="4" x2="4" y1="10" y2="3"/><line x1="12" x2="12" y1="21" y2="12"/><line x1="12" x2="12" y1="8" y2="3"/><line x1="20" x2="20" y1="21" y2="16"/><line x1="20" x2="20" y1="12" y2="3"/><line x1="2" x2="6" y1="14" y2="14"/><line x1="10" x2="14" y1="8" y2="8"/><line x1="18" x2="22" y1="16" y2="16"/></svg>
              Найдено: <span id="resultCount">0</span>
            </div>
          </div>
          <div id="tariffRow" class="flex flex-wrap gap-2"></div>
          <div id="serviceRow" class="flex flex-wrap gap-2"></div>
        </div>
      </div>
    </header>
    <main class="mx-auto max-w-7xl px-4 py-8 sm:px-6">
      <div id="gridMount"></div>
    </main>
  </div>
  <div id="modalMount"></div>
  <script src="/static/app.js"></script>
</body>
</html>
