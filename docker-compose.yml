services:
  app:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "4173:4173"
    command: sh -c "rm -f package-lock.json && npm install && npm run build && NODE_ENV=production npx serve dist/client -l 4173"

volumes:
  node_modules:
