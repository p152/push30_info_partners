services:
  app:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - node_modules_dev:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    command: sh -c "npm install && npm run dev"

  app-preview:
    image: node:22-alpine
    working_dir: /app
    profiles:
      - preview
    volumes:
      - .:/app
      - node_modules_preview:/app/node_modules
    ports:
      - "4173:4173"
    command: sh -c "rm -f package-lock.json && npm install && npm run build && NODE_ENV=production npx serve dist/client -l 4173"

volumes:
  node_modules_dev:
  node_modules_preview:
