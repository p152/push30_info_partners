services:
  app:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    command: sh -c "npm install && npm run dev"

  app-preview:
    image: node:22-alpine
    working_dir: /app
    profiles:
      - preview
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "4173:4173"
    environment:
      - NODE_ENV=production
    command: sh -c "npm install && npm run build && npx serve dist/client -l 4173"

volumes:
  node_modules:
